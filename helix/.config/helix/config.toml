theme = "catppuccin_mocha"

[editor]
line-number = "relative"
bufferline = "multiple"   

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false
git-ignore = false

[keys.normal]
"esc" = ["collapse_selection"]
